<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate Member Card — Paradise Member</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="panel">

      <h1 class="brand">GENERATE MEMBER CARD</h1>
      <p class="subtitle">Cari member berdasarkan nama atau Member ID</p>

      <!-- ============================================================
           SECTION: PENCARIAN MEMBER
      ============================================================= -->
      <label for="memberSearchInput">Cari Member</label>
      <input
        type="text"
        id="memberSearchInput"
        list="memberDataList"
        placeholder="Ketik nama atau kode member..."
        autocomplete="off">
      <datalist id="memberDataList"></datalist>

      <p id="statusMessage" class="status-message"></p>

      <button type="button" id="generateButton" disabled>GENERATE KARTU</button>

      <!-- ============================================================
           SECTION: HASIL KARTU (CANVAS)
      ============================================================= -->
      <div class="canvas-wrapper">
        <canvas id="memberCardCanvas" width="1671" height="941"></canvas>
      </div>

      <button type="button" id="downloadButton" class="hidden">DOWNLOAD KARTU (PNG)</button>

    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
